# Frozen competition interfaces
odom_topic: /competition/localization/odom
localization_status_topic: /competition/localization/status
pointcloud_topic: /livox/Pointcloud2
map_topic: /competition/map
mapping_status_topic: /competition/mapping/status

# Frozen frame contract; fixed window sized to cover the whole building.
# Robot travel is x in [-10, 10] and y from -3.2 (start) to 35.9 (north end),
# so the map covers x [-12.5, 12.5] and y [-6.5, 38.5] with margin, instead of
# a start-centred 40x40 box that wasted the south half and cut off the
# northern rooms.
map_frame: world
expected_base_frame: base
expected_cloud_frame: laser_livox
resolution: 0.10
map_width: 250
map_height: 450
origin_mode: fixed
origin_x: -12.5
origin_y: -6.5

# Points are filtered after timestamped TF conversion into base
sensor_min_range: 0.30
sensor_max_range: 20.0
# Base-frame floor returns measured in the qualification scene are
# -0.31..-0.18 m.  Exclude them while retaining obstacles >=~0.16 m tall.
min_height: -0.15
max_height: 1.50
point_stride: 1
max_points_per_cloud: 50000
tf_timeout: 0.10

# Health/status behavior
map_publish_rate: 2.0
status_heartbeat_rate: 10.0
integration_rate: 5.0
odom_timeout: 1.0
localization_status_timeout: 1.0
pointcloud_timeout: 1.0
max_input_age: 2.0
future_stamp_tolerance: 0.20
time_rollback_tolerance: 0.001
quaternion_norm_tolerance: 0.10

# Safety against localization discontinuities
max_pose_jump: 2.0
max_yaw_jump: 1.57
pose_recovery_samples: 3
reset_map_on_pose_jump: true
