common:
    lid_topic:  "/livox/Pointcloud2"
    imu_topic:  "/livox/imu"
    time_sync_en: false         # Simulation timestamps are usually synchronized
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 4               # 4=MARSIM: generic sensor_msgs/PointCloud2 handler
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     50.0         # Indoor environment: 50 m is sufficient
    extrinsic_est_en:  false    # Simulation: extrinsic is known, no online estimation
    extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: true
    interval: -1
