# Frozen competition interfaces
#
# =============================================================================
# 中文说明（模块级）：建图节点默认配置（多楼层）
#
# 本文件区分两类值：
#   1) 冻结的竞赛接口名（话题/帧）：跨模块契约，改名会破坏双向闭环。
#   2) 地图窗口与高度窗：可调参数。窗口按"覆盖整栋楼单层"固定，避免探索过程中
#      地图原点漂移导致坐标基准变化；高度窗把 base 系地面回波排除在障碍之外，
#      否则楼板会被写成障碍导致无路可走。
# 楼层切换相关：楼层激活指令来自 /competition/floor_state，切换时只有激活指针
#      改变，不同楼层的点云不会混进同一张地图。
# =============================================================================
odom_topic: /competition/localization/odom
localization_status_topic: /competition/localization/status
pointcloud_topic: /livox/Pointcloud2
map_topic: /competition/map
mapping_status_topic: /competition/mapping/status

# Provisional multi-floor compatibility adapter.  Publish Int32(-1) before
# elevator motion and publish the stable non-negative floor id after arrival.
# The output is latched.  Replace only these adapter topics after the team
# freezes the formal FloorState contract; the map-storage core stays unchanged.
floor_state_topic: /competition/floor_state
current_floor_topic: /competition/mapping/current_floor
initial_floor: 0
transition_floor_value: -1
max_floor_id: 31

# Frozen frame contract and 40 m x 40 m map
map_frame: world
expected_base_frame: base
expected_cloud_frame: laser_livox
resolution: 0.10
map_width: 400
map_height: 400
origin_mode: initial_pose
# Used only when origin_mode=fixed
origin_x: -20.0
origin_y: -20.0

# Points are filtered after timestamped TF conversion into base
sensor_min_range: 0.30
sensor_max_range: 20.0
# Base-frame floor returns measured in the qualification scene are
# -0.31..-0.18 m.  Exclude them while retaining obstacles >=~0.16 m tall.
min_height: -0.15
max_height: 1.50
point_stride: 1
max_points_per_cloud: 50000
tf_timeout: 0.10

# Health/status behavior
map_publish_rate: 2.0
status_heartbeat_rate: 10.0
integration_rate: 5.0
odom_timeout: 1.0
localization_status_timeout: 1.0
pointcloud_timeout: 1.0
max_input_age: 2.0
future_stamp_tolerance: 0.20
time_rollback_tolerance: 0.001
quaternion_norm_tolerance: 0.10

# Safety against localization discontinuities
max_pose_jump: 2.0
max_yaw_jump: 1.57
pose_recovery_samples: 3
reset_map_on_pose_jump: true
